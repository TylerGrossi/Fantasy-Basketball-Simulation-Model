# Regenerate the league snapshot and let Vercel deploy it.
#
# The app has no database: public/data/*.json is checked into git and shipped as part of
# the build, so "fresh data" means "a new commit". That is what this does — export, and
# push only if the numbers actually moved.
#
# Requires three repository secrets: ESPN_S2, ESPN_SWID, GEMINI_API_KEY.
# engine/config.py falls back to environment variables when config_secrets.py is absent
# (which it is here — that file is gitignored), and it insists on all three being present
# even though the export never calls Gemini.
#
# NOTE: pushing to main triggers a Vercel deploy. That is the entire point of this
# workflow, but it does mean the site can change without anyone touching it.

name: Refresh league snapshot

on:
  schedule:
    # EVERY TWO HOURS (owner, 2026-10-21; it was 7 AM + 5:30 PM Eastern), October through
    # April only — the NBA season. Free agents, injuries, rosters, the acquisition count
    # and the projections stay within two hours of ESPN; the live scores were never from
    # this export. A run only commits (and so deploys) when the data moved, so this is at
    # most 12 deploys a day. GitHub starts scheduled runs late or skips them under load —
    # the cadence is a target, not a clock.
    # The win-probability log still takes no reading while games are in progress (see
    # _reading_window_ok in scripts/build_data.py): those runs refresh everything else.
    # Outside the season the export would rewrite an identical finished season every run,
    # and every rewrite is a commit and a deploy. GitHub DISABLES cron entirely on a repo
    # with no activity for 60 days, which in the offseason is easy to hit.
    - cron: "0 */2 * 10,11,12,1,2,3,4 *"
  # Lets you run it by hand from the Actions tab — use this for the first run.
  workflow_dispatch:

concurrency:
  group: refresh-data
  # Never cancel a half-finished export: it writes league.json and boxscores.json
  # separately, and a killed run can leave the pair disagreeing with each other.
  cancel-in-progress: false

permissions:
  # Needed to push the regenerated snapshot back to main.
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install the export's dependencies
        run: pip install -r engine/requirements.txt

      # Writes public/data/league.json and boxscores.json. The script validates the
      # export BEFORE writing it, so a bad ESPN response fails the job instead of
      # overwriting a good snapshot.
      - name: Export the league snapshot
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/build_data.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install the Node toolchain
        run: npm ci

      # The Agent's spread baseline. It is derived from ~290 ESPN game logs and from the
      # season values in the league.json written above, so during a live season it goes
      # stale exactly as fast as the snapshot does. Takes ~2 minutes.
      - name: Rebuild the consistency baseline
        run: node scripts/build_consistency.mjs

      # Every export stamps a fresh generatedAt, so a plain `git status` always sees a
      # change. Compare with that field stripped, and throw away a timestamp-only rewrite
      # instead of committing (and deploying) it.
      - name: Commit and deploy, but only if the data moved
        run: |
          moved=0
          for f in public/data/*.json; do
            if ! git cat-file -e "HEAD:$f" 2>/dev/null; then moved=1; break; fi
            if ! python - "$f" <<'PY'
          import json, subprocess, sys
          f = sys.argv[1]
          strip = lambda d: {k: v for k, v in d.items() if k != "generatedAt"}
          old = json.loads(subprocess.run(["git", "show", f"HEAD:{f}"], capture_output=True, check=True).stdout)
          new = json.load(open(f, encoding="utf-8"))
          sys.exit(0 if strip(old) == strip(new) else 1)
          PY
            then moved=1; break; fi
          done
          if [ "$moved" = 0 ]; then
            echo "Only timestamps changed — nothing to deploy."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "chore(data): refresh league snapshot"
          git push
