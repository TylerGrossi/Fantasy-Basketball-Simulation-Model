# The Streamlit app now lives in legacy/ while its Next.js replacement is built at the
# repo root. It is still the live site, so this must keep working until cutover.
#
# Everything (modules, assets/, .streamlit/, requirements.txt) moved into legacy/ as ONE
# unit, so every import is unchanged - the modules are still siblings of each other.
# `cd legacy` is what makes that work, and it is also how Streamlit finds
# .streamlit/config.toml, which it looks for in the working directory.
services:
  - type: web
    name: fbbsim
    runtime: python
    plan: free
    buildCommand: cd legacy && pip install -r requirements.txt
    startCommand: cd legacy && streamlit run streamlit_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
